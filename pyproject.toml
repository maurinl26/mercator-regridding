[project]
name = "mercator-regridding-exemple"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.26.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "parcels>=4.0.0",
    "plotly>=7.1.0",
    "pyresample>=1.35.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regridding"]

[tool.uv]
package = true

